[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repofix-harness"
version = "4.3.0"
requires-python = ">=3.10"
dependencies = ["openai>=1.40.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
repofix = "repofix.cli:main"
repofix-eval = "repofix.eval_cli:main"
repofix-runs = "repofix.runs_cli:main"
repofix-doctor = "repofix.doctor_cli:main"
repofix-compare = "repofix.comparison_cli:main"

[tool.setuptools.packages.find]
include = ["repofix*"]
exclude = ["tests*", "examples*", "evals*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
