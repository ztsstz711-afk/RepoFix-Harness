[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repofix-harness"
version = "4.9.0"
requires-python = ">=3.10"
# openai 1.40 passes the removed `proxies` argument to httpx 0.28+ during
# client construction. Keep the transport in the compatible 0.27 series so a
# provider preflight fails for task reasons, not before any request is made.
dependencies = ["openai>=1.40.0", "httpx<0.28"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
repofix = "repofix.cli:main"
repofix-eval = "repofix.eval_cli:main"
repofix-runs = "repofix.runs_cli:main"
repofix-doctor = "repofix.doctor_cli:main"
repofix-compare = "repofix.comparison_cli:main"

[tool.setuptools.packages.find]
include = ["repofix*"]
exclude = ["tests*", "examples*", "evals*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
